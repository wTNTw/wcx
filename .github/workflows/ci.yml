name: CI

# Trigger CI rebuild for v125 returnType fixes
on:
  push:
    branches:
      - master
      - dev
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
      - '**/*.js'
      - 'docs/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
      - '**/*.js'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_signing:
        description: '仅测试用：无固定签名 keystore 时跳过签名（产物为 unsigned，不发版）'
        type: boolean
        default: false
      fast:
        description: '测速用：跳过 release lint vital 与 Compose 编译映射（产物功能不变）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    # 卡死保护：Hchat 整树后构建正常 30-45 分钟，超过 90 分钟视为异常直接失败
    timeout-minutes: 90
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      startsWith(github.ref, 'refs/tags/') ||
      (
        !startsWith(github.event.head_commit.message, '[skip ci]') && 
        (
          github.ref == 'refs/heads/master' ||
          github.ref == 'refs/heads/dev' ||
          github.event_name == 'pull_request'
        )
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Apply CI memory profile
        run: |
          # 仓库 gradle.properties 里放的是「本地快速构建」的默认值（parallel / Kotlin daemon 等）。
          # CI runner 内存紧张，必须换回省内存的配置：Gradle 属性优先级是
          # 命令行 > $GRADLE_USER_HOME/gradle.properties > 仓库 gradle.properties，
          # 所以写进用户目录就能覆盖仓库默认值（本地开发不受影响）。
          GUH="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$GUH"
          cat >> "$GUH/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Xss512k -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:ReservedCodeCacheSize=512m
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=daemon
          kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
          android.r8.maxWorkers=1
          EOF
          echo "CI gradle profile:"; cat "$GUH/gradle.properties"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi,i686-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target

      - name: Cache Gradle build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/configuration-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update -qq
          sudo apt install -y gcc-multilib || true

      - name: Install Android NDK & CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          # Zygisk 注入器（cargo + cmake + NDK r30）和 zipalign/apksigner 需要这些
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;30.0.14904198" "build-tools;36.0.0" >/dev/null 2>&1
          sudo apt-get install -y ninja-build >/dev/null 2>&1
          ls "$SDK/ndk" "$SDK/build-tools"

      - name: Prepare LSPlant submodules
        run: |
          # LSPlant 的 test/ 子模块用 SSH，所以 .gitmodules 里对 third_party/lsplant 设了
          # update=none（checkout 的 submodules: recursive 会跳过它）。这里用 -c 覆盖回 checkout，
          # 并只初始化构建需要的那两层。
          git -c submodule.third_party/lsplant.update=checkout submodule update --init \
            third_party/lsplant third_party/xz-embedded
          git -C third_party/lsplant submodule update --init \
            lsplant/src/main/jni/external/dex_builder
          git -C third_party/lsplant/lsplant/src/main/jni/external/dex_builder \
            submodule update --init external/parallel_hashmap

      - name: Build Zygisk injector
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export WCX_ANDROID_NDK="$SDK/ndk/30.0.14904198"
          export WCX_ANDROID_API=28
          # 指定 NDK 的 clang 作为链接器；否则 cargo 用宿主 cc，-ldobby 等直接找不到
          CC_BIN="$WCX_ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_BIN/aarch64-linux-android28-clang"
          cargo build -p wcx-zygisk --target aarch64-linux-android --release
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp -v target/aarch64-linux-android/release/libwcx_zygisk.so \
            app/src/main/jniLibs/arm64-v8a/libwcx_zygisk.so

      - name: Build native library
        run: |
          cargo xtask configure
          # NDK r30 的 cdefs.h 要求显式 __ANDROID_API__；bindgen（含依赖 crate
          # 如 silk-v3-sys）默认传入无版本 target 会重置 __ANDROID_API__，解析
          # sysroot 头文件时报 "Unversioned target triples are not supported!"。
          # 兜底改写 configure 生成的 .cargo/config.toml：追加 -D__ANDROID_API__
          # 与带 API 版本的 --target（覆盖 bindgen 默认无版本 target）。
          # 注：xtask configure 已生成同款参数，此处仅作旧 xtask 缓存时的兜底。
          CFG_FILE="app/src/main/rust/wekit-native/.cargo/config.toml"
          sed -i \
            -e 's|BINDGEN_EXTRA_CLANG_ARGS_\([A-Za-z0-9_-]*\) = "--sysroot=\([^"]*\)"|BINDGEN_EXTRA_CLANG_ARGS_\1 = "--sysroot=\2 -D__ANDROID_API__=28"|' \
            -e 's|BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android = "\("[^"]*\)"|BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android = "\1 --target=aarch64-linux-android28"|' \
            -e 's|BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android = "\("[^"]*\)"|BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android = "\1 --target=x86_64-linux-android28"|' \
            -e 's|BINDGEN_EXTRA_CLANG_ARGS_armv7-linux-androideabi = "\("[^"]*\)"|BINDGEN_EXTRA_CLANG_ARGS_armv7-linux-androideabi = "\1 --target=armv7a-linux-androideabi28"|' \
            -e 's|BINDGEN_EXTRA_CLANG_ARGS_i686-linux-android = "\("[^"]*\)"|BINDGEN_EXTRA_CLANG_ARGS_i686-linux-android = "\1 --target=i686-linux-android28"|' \
            "$CFG_FILE"
          grep 'BINDGEN_EXTRA' "$CFG_FILE"
          cargo xtask build --native-only

      - name: Prepare keystore
        if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.skip_signing)
        run: |
          KS_FILE="$RUNNER_TEMP/wekit-keystore.jks"
          CRED_FILE="$RUNNER_TEMP/keystore-creds.env"

          # ── Decode project keystore from GitHub Secrets ──────────────────
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::group::Decoding project keystore from Secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KS_FILE"
            KS_SIZE=$(stat -c%s "$KS_FILE" 2>/dev/null || echo 0)
            echo "Keystore file size: ${KS_SIZE} bytes"

            if [ "$KS_SIZE" -lt 100 ]; then
              echo "::error::Decoded keystore is too small (${KS_SIZE} bytes) — Base64 decode may have failed"
              exit 1
            fi

            # Try PKCS12 first, then JKS
            KS_LOADED=false
            for STORE_TYPE in PKCS12 JKS; do
              if keytool -list -keystore "$KS_FILE" \
                   -storetype "$STORE_TYPE" \
                   -storepass "${{ secrets.STORE_PASSWORD }}" \
                   -alias "${{ secrets.KEY_ALIAS }}" >/dev/null 2>&1; then
                echo "Keystore loaded successfully (type=${STORE_TYPE})"
                KS_LOADED=true
                break
              fi
            done

            if [ "$KS_LOADED" = true ]; then
              echo "Using project keystore from GitHub Secrets."
              echo "KS_PASS=${{ secrets.STORE_PASSWORD }}" > "$CRED_FILE"
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$CRED_FILE"
              echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> "$CRED_FILE"
              keytool -list -keystore "$KS_FILE" \
                -storepass "${{ secrets.STORE_PASSWORD }}" \
                -alias "${{ secrets.KEY_ALIAS }}" 2>&1 | head -5
              echo "::endgroup::"
              exit 0
            fi

            echo "::error::Project keystore present but unreadable — check STORE_PASSWORD / KEY_ALIAS"
            echo "::endgroup::"
            exit 1
          fi

          # 固定签名强约束（用户要求）：走到这里说明 Secrets 未提供可用的固定 keystore。
          # 已禁用「临时 CI keystore」兜底 — 宁可不发版，也不产出无法覆盖安装的包。
          echo "::error::固定签名不可用（KEYSTORE_BASE64 缺失或无效）— 已禁用临时签名兜底，拒绝构建。请检查 Secrets：KEYSTORE_BASE64 / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
          exit 1

      - name: Build Release (Signed)
        if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.skip_signing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEKIT_KEYSTORE_FILE: ${{ runner.temp }}/wekit-keystore.jks
        run: |
          source "$RUNNER_TEMP/keystore-creds.env"
          export WEKIT_KEYSTORE_PASSWORD="$KS_PASS"
          export WEKIT_KEY_ALIAS="$KEY_ALIAS"
          export WEKIT_KEY_PASSWORD="$KEY_PASS"
          ./gradlew assembleRelease --warning-mode all --stacktrace ${{ (github.event_name == 'workflow_dispatch' && inputs.fast) && '-Pfast' || '' }}

      - name: Build Release (Unsigned)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.skip_signing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleRelease --warning-mode all --stacktrace ${{ (github.event_name == 'workflow_dispatch' && inputs.fast) && '-Pfast' || '' }}

      - name: Collect APKs
        run: |
          mkdir -p dist/apk
          # AGP 产物统一去掉 -unsigned 后缀（PR 构建设计为未签名，文件名保持一致）
          find app/build/outputs/apk -type f -name '*.apk' | while read -r apk; do
            cp -v "$apk" "dist/apk/$(basename "$apk" | sed 's/-unsigned\.apk$/.apk/')"
          done
          echo "Collected APKs:"
          ls -1 dist/apk

      # APK 本身就是 Zygisk 模块包（改名 .zip 即可刷入），所以只把 standard/arm64 换成一一体包，
      # 不再另外输出 / 上传单独的 zygisk zip。
      - name: Replace standard arm64 APK with the dual-purpose build
        if: github.event_name != 'pull_request'
        run: |
          ls -1 app/build/outputs/zygisk/
          UNIFIED=$(ls app/build/outputs/zygisk/*-arm64-v8a.apk 2>/dev/null | head -1 || true)
          test -n "$UNIFIED" || { echo "::error::没有产出一体包"; exit 1; }
          cp -v "$UNIFIED" dist/apk/app-standard-arm64-v8a-release.apk
          echo "Published APKs:"
          ls -1 dist/apk

      - name: Verify APK signatures (fixed keystore)
        if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.skip_signing)
        run: |
          # 用户要求：发布的 APK 必须使用仓库固定签名。用固定 keystore 反查证书 SHA-256，
          # 与每个产物 APK 的签名逐一比对，不一致立即失败，杜绝临时/未知签名流出。
          EXPECTED=$(keytool -list -v \
            -keystore "$RUNNER_TEMP/wekit-keystore.jks" \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" 2>/dev/null \
            | grep -iE 'SHA256:' | head -1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Expected cert SHA-256: $EXPECTED"
          if [ -z "$EXPECTED" ]; then
            echo "::error::无法从固定 keystore 读取证书指纹（STORE_PASSWORD / KEY_ALIAS 有误？）"
            exit 1
          fi
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || APKSIGNER="apksigner"
          echo "apksigner: $APKSIGNER"
          FAIL=0
          for f in dist/apk/*.apk; do
            [ -f "$f" ] || continue
            ACTUAL=$("$APKSIGNER" verify --print-certs "$f" 2>/dev/null | grep -iE 'certificate SHA-256 digest' | head -1 | sed 's/.*digest:[[:space:]]*//' | tr -d ':' | tr 'A-F' 'a-f')
            echo "  $f -> $ACTUAL"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::APK 签名与固定签名不一致：$f"
              FAIL=1
            fi
          done
          if [ "$FAIL" != "0" ]; then
            echo "::error::存在非固定签名的 APK，拒绝发布。"
            exit 1
          fi
          echo "All APK signatures match the fixed keystore."


      - name: Collect mappings
        run: |
          mkdir -p dist/mapping
          for m in app/build/outputs/mapping/*/mapping.txt; do
            flavorDir=$(basename "$(dirname "$m")")
            cp -v "$m" "dist/mapping/mapping-${flavorDir}.txt"
          done
          ls -1 dist/mapping || echo "(no mappings)"

      # 四个 APK 分开上传（不再打成一个 50MB 的 artifact zip）
      - name: Upload APK (standard arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: wcx-standard-arm64-v8a
          path: dist/apk/app-standard-arm64-v8a-release.apk

      - name: Upload APK (standard armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: wcx-standard-armeabi-v7a
          path: dist/apk/app-standard-armeabi-v7a-release.apk

      - name: Upload APK (legacy arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: wcx-legacy-arm64-v8a
          path: dist/apk/app-legacy-arm64-v8a-release.apk

      - name: Upload APK (legacy armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: wcx-legacy-armeabi-v7a
          path: dist/apk/app-legacy-armeabi-v7a-release.apk

      - name: Upload Release Obfuscation Mapping
        uses: actions/upload-artifact@v7
        with:
          name: wcx-mapping
          path: dist/mapping/*.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ success() && github.ref == 'refs/heads/master' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wcx-*
          path: artifacts
          merge-multiple: true

      - name: Generate version info
        id: version
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          # 版本号单一数据源：直接从 app/build.gradle.kts 读取，
          # 避免 CI 与 APK 版本号漂移；发版时只改 build.gradle.kts
          VERSION_CODE=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+$')
          VERSION_NAME=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | grep -oE '"[^"]+"$' | tr -d '"')
          VERSION_TAG="v${VERSION_CODE}"
          echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "hash=${GIT_HASH}" >> $GITHUB_OUTPUT
          echo "count=${VERSION_CODE}" >> $GITHUB_OUTPUT

          cat > artifacts/update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_TAG}",
            "commit": "${GIT_HASH}"
          }
          EOF

          echo "Generated update.json:"
          cat artifacts/update.json

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "prev_tag=" >> $GITHUB_OUTPUT
            echo "changelog=首次发布" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT

          COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" || echo "")

          FEATURES=""
          FIXES=""
          REMOVED=""
          OTHER=""

          while IFS= read -r line; do
            msg=$(echo "$line" | sed 's/^- //')
            if echo "$msg" | grep -qiE "^(feat|新增|添加|增加|实现)"; then
              FEATURES="${FEATURES}- ${msg}"$'\n'
            elif echo "$msg" | grep -qiE "^(fix|修复|bug|解决|修)"; then
              FIXES="${FIXES}- ${msg}"$'\n'
            elif echo "$msg" | grep -qiE "^(remove|删除|移除|去掉)"; then
              REMOVED="${REMOVED}- ${msg}"$'\n'
            else
              OTHER="${OTHER}- ${msg}"$'\n'
            fi
          done <<< "$COMMITS"

          CHANGELOG=""

          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### 🎉 新增功能"$'\n'
            CHANGELOG="${CHANGELOG}${FEATURES}"$'\n'
          fi

          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### 🐛 修复问题"$'\n'
            CHANGELOG="${CHANGELOG}${FIXES}"$'\n'
          fi

          if [ -n "$REMOVED" ]; then
            CHANGELOG="${CHANGELOG}### 🗑️ 移除功能"$'\n'
            CHANGELOG="${CHANGELOG}${REMOVED}"$'\n'
          fi

          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}### 🔧 其他改进"$'\n'
            CHANGELOG="${CHANGELOG}${OTHER}"$'\n'
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="暂无详细更新记录"
          fi

          echo "$CHANGELOG" > artifacts/CHANGELOG.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "Generated changelog:"
          cat artifacts/CHANGELOG.md

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WCX ${{ steps.version.outputs.tag }}
          body: |
            ## WCX ${{ steps.version.outputs.tag }}

            正式发行版本

            提交 SHA: `${{ steps.version.outputs.hash }}`

            ${{ steps.changelog.outputs.changelog }}

            ### 📦 下载
            - 下方 Assets 中下载对应架构/框架的 APK
            - `standard` 的 arm64 APK 是**一体包**：直接安装走 LSPosed；把后缀改成 `.zip` 即是在 Magisk / KernelSU / APatch 刷的 Zygisk 模块（无需 LSPosed）
            - update.json 供模块内置更新器使用
          files: |
            artifacts/*.apk
            artifacts/update.json
            artifacts/CHANGELOG.md
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
