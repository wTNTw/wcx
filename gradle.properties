# ─── 本地开发默认（快速增量构建）──────────────────────────────────────────────
# 这里刻意放「本地开发最优」的值。CI（4 核 / 内存紧张）需要的省内存配置由
# .github/workflows/ci.yml 写进 $GRADLE_USER_HOME/gradle.properties 覆盖 —— Gradle 的
# 属性优先级是 命令行 > 用户目录 gradle.properties > 仓库 gradle.properties，所以仓库里
# 的默认值不会拖累 CI，本地也不用每次手敲 flag。
# Gradle 侧 4g（6g 时实测 RSS 8.4g，和 Kotlin daemon 一起会把 16G 吃满，
# 导致 Gradle 连 zipalign 都 fork 不出来）；Kotlin daemon 必须留 4g（2g 会直接报 Not enough memory）。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Xss512k -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:ReservedCodeCacheSize=512m
# 多核机器上串行执行纯属浪费；开并行后 KSP / 资源 / 原生库 / 各 flavor 之间能重叠
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
android.r8.gradual.support=true
kotlin.code.style=official

# Kotlin 编译放到独立的 Kotlin daemon：进程跨构建复用，且不和 Gradle daemon 抢同一个堆。
# （in-process 更省内存，但每次都要在 Gradle daemon 里重建编译环境，本地全量与增量都更慢；
#   CI 才用 in-process，见 ci.yml。）
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

# 构建脚本里的 BuildConfig.BUILD_TIMESTAMP 已改成「最后一次提交时间」（可用
# -PwekitBuildTimestamp=<epochMillis> 覆盖），配置阶段产物因此是稳定的：
# 需要时可以再开配置缓存（./gradlew --configuration-cache 或取消下一行注释），
# 每次构建能省 10s+ 的配置阶段。
# org.gradle.configuration-cache=true

systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=600000
# jvmTarget=21（miuix 0.9.4）：不锁定 installations.paths，直接使用 CI setup-java 的 JDK 21
android.builder.sdkDownload=false
