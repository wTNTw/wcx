<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zygisk - WCX</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main class="page">
    <header class="head">
      <h1>Zygisk - WCX</h1>
      <p class="sub">选择要注入的微信（支持多用户 / 分身）</p>
    </header>

    <section class="card">
      <div class="row between">
        <strong>注入作用域</strong>
        <button id="refresh" class="btn ghost">刷新</button>
      </div>
      <p class="hint">列出设备上所有 Android 用户中包名以 <code>com.tencent.mm</code> 开头的应用。</p>
      <ul id="targets" class="targets"></ul>
      <p id="targets-empty" class="hint" hidden>没有找到微信（是否已安装？）</p>
    </section>

    <footer class="foot">
      <span id="status" class="hint">—</span>
    </footer>
  </main>

  <script src="js/bridge.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
