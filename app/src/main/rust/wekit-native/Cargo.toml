[package]
name = "wekit-native"
version = "0.1.0"
edition = "2024"

[lib]
name = "wekit_native"
crate-type = ["cdylib"]

[features]
default = []
wekite_hook = ["dep:wekite-art"]

[dependencies]
wekite-art = { path = "../../../../../libs/common/wekite-art", optional = true }
jni = { version = "0.22", default-features = false }
libc = "0.2"
sha2 = { version = "0.11", default-features = false }

[build-dependencies]
bindgen = "0.72"
